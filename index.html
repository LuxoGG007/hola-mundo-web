<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Hola Mundo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #050805;

      color: #76ff03;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    main {
      text-align: center;
    }

    h1 {
      margin: 0;

      font-size: clamp(
        50px,
        10vw,
        120px
      );

      letter-spacing: -0.05em;

      text-shadow:
        0 0 30px
        rgba(118, 255, 3, 0.35);
    }

    p {
      color: #aab7a4;

      font-size: 18px;
    }

    .status {
      display: inline-block;

      margin-top: 30px;

      padding: 10px 18px;

      border:
        1px solid
        rgba(118, 255, 3, 0.4);

      font-size: 12px;

      letter-spacing: 0.15em;
    }
  </style>
</head>

<body>

  <main>

    <h1>HOLA MUNDO.</h1>

    <p>
      Mi primera página publicada en Internet.
    </p>

    <div class="status">
      ● ONLINE
    </div>

  </main>

</body>
</html>
